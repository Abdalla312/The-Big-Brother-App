<table role="presentation" style="width:100%; border-collapse:collapse;" th:fragment="button(url, text, style)">
  <tr>
    <td style="text-align:center; padding:24px 0;">
      <table role="presentation" style="border-collapse:collapse;">
        <tr>
          <td th:style="|background:${style == 'primary' ? '#1E40AF' : (style == 'secondary' ? '#6B7280' : '#1E40AF')}; border-radius:8px;|" style="background:#1E40AF; border-radius:8px;">
            <a th:href="${url}" th:text="${text}" style="display:inline-block; padding:14px 28px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-size:16px; font-weight:600; color:#ffffff; text-decoration:none; line-height:1.2;">Verify Email</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
