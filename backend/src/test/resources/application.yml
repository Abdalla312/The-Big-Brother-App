spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
  flyway:
    default-schema: public
  test:
    database:
      replace: none
  mail:
    host: localhost
    port: 1025
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false


app:
  backend-url: http://localhost:8080
  frontend-url: http://localhost:3000
  rate-limit:
    enabled: false
    capacity: 5
    refill-rate: 1
    refill-period-seconds: 60
  jwt:
    secret: MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUY=
    access-token-expiry-ms: 9000000
    refresh-token-expiry-days: 30
  verification:
    expiry-hours: 1
  brand:
      name: "Big Brother Test"
      primary-color: "#1E40AF"
      support-email: "test@example.com"
  reset:
      expiry-minutes: 30
  mail:
    from-address: ${MAIL_FROM:expense.tracker.big.brother@gmail.com}
    from-name: ${MAIL_FROM_NAME:Big Brother Team}
    reply-to: ${MAIL_REPLY_TO:expense.tracker.big.brother@gmail.com}