<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Big Brother - Expense Tracker</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('bb_theme');
        var dark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
  <script src="vendor/chart.umd.min.js"></script>
  <script src="vendor/lucide.min.js"></script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="text-gray-900 antialiased bg-page">
  <div id="app" class="flex h-screen overflow-hidden">
    <div id="sidebar-container"></div>
    <div class="flex flex-1 flex-col overflow-hidden">
      <div id="header-container"></div>
      <main id="app-content" class="flex-1 overflow-y-auto p-6"></main>
    </div>
  </div>

  <div id="auth-container" class="hidden min-h-screen flex items-center justify-center bg-page p-4">
    <div id="auth-content" class="w-full max-w-md"></div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
